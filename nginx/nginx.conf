events {}

http {

    # Conditionally set Connection header:
    # - WebSocket requests get "upgrade"
    # - Regular HTTP requests get "close"
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # ---------- Frontend ----------
        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Backend ----------
        # Match /api/budgets  → proxy as /budgets/
        # Match /api/budgets/ → proxy as /budgets/
        # The trailing slash on proxy_pass strips /api, then we ensure
        # a trailing slash is always present so FastAPI doesn't need to redirect.
        location ~ ^/api(/.*)?$ {
            # Capture the path after /api; default to "/" if nothing follows
            set $backend_path $1;
            if ($backend_path = '') {
                set $backend_path /;
            }

            # Ensure trailing slash so FastAPI routes match without a 307
            if ($backend_path !~ /$) {
                set $backend_path "${backend_path}/";
            }

            proxy_pass http://backend$backend_path$is_args$args;

            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}